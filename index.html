<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" id="metaTheme" content="#070b10">
<meta name="color-scheme" content="dark light">
<title>Jam Timer</title>
<script>
(function () {
  var pref = null;
  try { pref = localStorage.getItem('jam-timer-theme'); } catch (e) {}
  var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  var theme = (pref === 'light' || pref === 'dark') ? pref : (light ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.style.colorScheme = theme;
  var meta = document.getElementById('metaTheme');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#070b10' : '#eef2f6');
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#070b10;--panel:#101923;--line:#22303f;--text:#eef5fb;--muted:#8ea4b7;
  --go:#2fd18a;--goInk:#03251a;--stop:#ff4d61;--stopInk:#fff;
  --accent:#ff7a59;--blue:#5cb8ff;--warn:#ffc857;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{--bg:#eef2f6;--panel:#fff;--line:#d3dde7;--text:#0c151d;--muted:#5a6f83;
  --go:#0f9f6a;--goInk:#fff;--stop:#d62b40;--stopInk:#fff;
  --accent:#e2552f;--blue:#0a74c9;--warn:#b77900;}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  height:100vh;height:100dvh;display:flex;overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-font-smoothing:antialiased;
}
main{
  flex:1;display:flex;flex-direction:column;gap:9px;width:100%;max-width:820px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.badge{
  font-size:.64rem;font-weight:800;letter-spacing:.13em;padding:6px 9px;border-radius:8px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
body[data-phase="jam"] .badge{color:var(--accent);border-color:rgba(255,122,89,.45)}
body[data-phase="lineup"] .badge{color:var(--blue);border-color:rgba(92,184,255,.4)}
body[data-phase="timeout"] .badge{color:var(--warn);border-color:rgba(255,200,87,.4)}
.meta{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--muted);white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--text);font-weight:800}
.headerEnd{display:flex;align-items:center;gap:8px;min-width:0}
.themeBtn{
  flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);
  font-size:.55rem;font-weight:800;letter-spacing:.1em;padding:5px 7px;line-height:1;
}
.themeBtn:active{background:var(--panel)}

.period{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);
}
.lbl{font-size:.6rem;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.periodTime{
  font-family:var(--mono);font-size:clamp(1.6rem,7vw,2.4rem);font-weight:800;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;
  background:none;border:0;border-bottom:2px dotted var(--line);color:var(--text);
  padding:1px 2px;cursor:pointer;
}
.periodTime.over{color:var(--stop)}

.clock{
  position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:8px 12px;border:1px solid var(--line);
  border-radius:22px;background:var(--panel);overflow:hidden;
}
body[data-phase="jam"] .clock{border-color:rgba(255,122,89,.4)}
body[data-phase="lineup"] .clock{border-color:rgba(92,184,255,.35)}
body[data-phase="timeout"] .clock{border-color:rgba(255,200,87,.4)}
.clockLabel{font-size:clamp(.6rem,2.4vw,.8rem);font-weight:800;letter-spacing:.16em;color:var(--muted)}
.clockTime{
  font-family:var(--mono);font-weight:800;line-height:.9;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;font-size:clamp(5rem,min(34vw,32vh),14rem);white-space:nowrap;
  background:none;border:0;padding:0;color:inherit;cursor:pointer;
}
body[data-phase="jam"] .clockTime{color:var(--accent)}
body[data-phase="lineup"] .clockTime{color:var(--blue)}
body[data-phase="timeout"] .clockTime{color:var(--warn)}
.clockSub{font-size:clamp(.7rem,2.7vw,.9rem);color:var(--muted);text-align:center;min-height:1.2em}
.configLine{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 10px;margin-top:1px}
.cfg{
  background:none;border:0;border-bottom:1px dotted var(--line);color:var(--muted);
  font:inherit;font-size:clamp(.56rem,2.2vw,.68rem);font-weight:700;letter-spacing:.05em;
  padding:2px 0;cursor:pointer;
}
.cfg b{color:var(--text);margin-left:3px;font-weight:800;font-variant-numeric:tabular-nums}
.cfg.active b{color:var(--accent)}
.editor{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border:1px solid var(--line);border-radius:12px;background:var(--panel);
}
.editorLabel{font-size:.6rem;font-weight:800;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
#editorInput{
  flex:1;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel2);color:var(--text);font-family:var(--mono);font-size:1rem;
  font-weight:700;text-align:center;
}
#editorInput:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.unit{font-size:.62rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.mini{
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  color:var(--text);font-size:.68rem;font-weight:800;letter-spacing:.06em;
}
.mini.ghost{background:transparent;color:var(--muted)}

.primary{
  width:100%;min-height:clamp(70px,12vh,96px);border:0;border-radius:18px;
  font-weight:900;font-size:clamp(1.05rem,4.2vw,1.4rem);letter-spacing:.09em;text-transform:uppercase;
  transition:transform .06s ease;
}
.primary:active{transform:scale(.985)}
.primary.go{background:var(--go);color:var(--goInk)}
.primary.stop{background:var(--stop);color:var(--stopInk)}
.primary.neutral{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.row{display:flex;gap:8px}
.util{
  flex:1;min-height:52px;border:1px solid var(--line);border-radius:14px;background:transparent;
  color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.util:active{background:var(--panel)}
.util:disabled{opacity:.35}
.util.armed{color:var(--stop);border-color:rgba(255,77,97,.55)}

@media (orientation:landscape) and (max-height:560px){
  main{gap:6px;padding-top:calc(6px + env(safe-area-inset-top))}
  .period{padding:5px 12px}
  .periodTime{font-size:1.45rem}
  .clockTime{font-size:clamp(3.4rem,min(26vw,30vh),7rem)}
  .primary{min-height:64px}
  .util{min-height:44px}
}
</style>
</head>
<body data-phase="ready">
<main>
  <header>
    <span id="phase" class="badge" aria-live="polite">READY</span>
    <span class="headerEnd">
      <span class="meta"><b id="periodMeta">PERIOD 1/2</b> · <span id="jamMeta">JAM 0</span></span>
      <button id="theme" class="themeBtn" aria-label="Theme: follow device">AUTO</button>
    </span>
  </header>

  <section class="period" aria-label="Period clock">
    <span class="lbl">PERIOD</span>
    <button id="periodTime" class="periodTime" aria-label="Set period length">30:00</button>
  </section>

  <div class="editor" id="editor" hidden>
    <span class="editorLabel" id="editorLabel">JAM LENGTH</span>
    <input id="editorInput" type="text" maxlength="5" autocomplete="off" spellcheck="false" aria-label="Time as minutes and seconds">
    <span class="unit">m:ss</span>
    <button class="mini" id="editorSet">SET</button>
    <button class="mini ghost" id="editorCancel" aria-label="Cancel">✕</button>
  </div>

  <section class="clock" aria-label="Jam clock">
    <div id="clockLabel" class="clockLabel">JAM CLOCK</div>
    <button id="clockTime" class="clockTime" aria-label="Set jam length">2:00</button>
    <div id="clockSub" class="clockSub">Tap start</div>
    <div class="configLine" id="configLine">
      <button class="cfg" data-kind="jam">JAM <b id="cfgJam">2:00</b></button>
      <button class="cfg" data-kind="lineup">LINEUP <b id="cfgLineup">0:30</b></button>
      <button class="cfg" data-kind="timeout">TIMEOUT <b id="cfgTimeout">1:00</b></button>
    </div>
  </section>

  <button id="primary" class="primary go">START JAM</button>
  <div class="row">
    <button id="timeout" class="util" disabled>TIMEOUT</button>
    <button id="test" class="util" aria-label="Test end-of-jam alert">TEST</button>
    <button id="reset" class="util">RESET</button>
  </div>
</main>

<script>
(function () {
  'use strict';

  var PERIODS = 2;
  var TIMES_KEY = 'jam-timer-times';
  var THEME_KEY = 'jam-timer-theme';
  var DEFAULTS = { period: 30 * 60, jam: 2 * 60, lineup: 30, timeout: 60 };
  var KIND_LABELS = { period: 'PERIOD LENGTH', jam: 'JAM LENGTH', lineup: 'LINEUP LENGTH', timeout: 'TIMEOUT LENGTH' };
  var settings = loadTimes();
  var themePref = loadThemePref();

  var phase = 'ready';
  var periodNo = 1;
  var jamNo = 0;
  var period = { value: settings.period * 1000, running: false, anchor: 0 };
  var main = { value: settings.jam * 1000, running: false, anchor: 0, mode: 'jam' };
  var editing = null;

  var lastFrame = 0;
  var resetArmed = false;
  var resetTimer = null;
  var flashMsg = null;
  var flashTimer = null;

  var el = {
    badge: document.getElementById('phase'),
    periodMeta: document.getElementById('periodMeta'),
    jamMeta: document.getElementById('jamMeta'),
    periodTime: document.getElementById('periodTime'),
    clockLabel: document.getElementById('clockLabel'),
    clockTime: document.getElementById('clockTime'),
    clockSub: document.getElementById('clockSub'),
    primary: document.getElementById('primary'),
    timeout: document.getElementById('timeout'),
    test: document.getElementById('test'),
    reset: document.getElementById('reset'),
    configLine: document.getElementById('configLine'),
    cfgJam: document.getElementById('cfgJam'),
    cfgLineup: document.getElementById('cfgLineup'),
    cfgTimeout: document.getElementById('cfgTimeout'),
    editor: document.getElementById('editor'),
    editorLabel: document.getElementById('editorLabel'),
    editorInput: document.getElementById('editorInput'),
    editorSet: document.getElementById('editorSet'),
    editorCancel: document.getElementById('editorCancel'),
    theme: document.getElementById('theme')
  };

  var actx = null;

  function audio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!actx) { try { actx = new AC(); } catch(e) { return null; } }
    if (actx.state === 'suspended') { actx.resume().catch(function () {}); }
    return actx;
  }

  function chime() {
    var a = audio();
    if (!a) return;
    var t = a.currentTime + 0.02;
    var notes = [880, 1174];
    for (var i = 0; i < notes.length; i++) {
      var at = t + i * 0.18;
      var o = a.createOscillator();
      var g = a.createGain();
      o.type = 'sine';
      o.frequency.value = notes[i];
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.12, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.17);
      o.connect(g);
      g.connect(a.destination);
      o.start(at);
      o.stop(at + 0.19);
    }
  }

  function buzz() {
    if (!navigator.vibrate) return false;
    try { return navigator.vibrate([120, 80, 120, 80, 320]) !== false; } catch (e) { return false; }
  }

  function flash(text) {
    flashMsg = text;
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      flashMsg = null;
      flashTimer = null;
      render();
    }, 2600);
    render();
  }

  function alertEnd() {
    buzz();
    chime();
  }

  function now() { return performance.now(); }

  function read(c) {
    if (!c.running) return Math.max(0, c.value);
    return Math.max(0, c.value - (now() - c.anchor));
  }
  function start(c) {
    if (c.running) return;
    c.anchor = now();
    c.running = true;
  }
  function stop(c) {
    if (!c.running) return;
    c.value = read(c);
    c.running = false;
  }
  function setMain(mode, ms, running) {
    main = { mode: mode, value: ms, running: false, anchor: 0 };
    if (running) start(main);
  }
  function fmt(ms) {
    var t = Math.ceil(Math.max(0, ms) / 1000);
    return Math.floor(t / 60) + ':' + (t % 60 < 10 ? '0' : '') + (t % 60);
  }
  function set(node, text) {
    if (node.textContent !== text) node.textContent = text;
  }

  function loadTimes() {
    var out = { period: DEFAULTS.period, jam: DEFAULTS.jam, lineup: DEFAULTS.lineup, timeout: DEFAULTS.timeout };
    try {
      var raw = JSON.parse(localStorage.getItem(TIMES_KEY));
      if (raw && typeof raw === 'object') {
        Object.keys(out).forEach(function (k) {
          var n = parseInt(raw[k], 10);
          if (isFinite(n) && n >= 1 && n <= 3600) out[k] = n;
        });
      }
    } catch (e) {}
    return out;
  }
  function saveTimes() {
    try { localStorage.setItem(TIMES_KEY, JSON.stringify(settings)); } catch (e) {}
  }
  function loadThemePref() {
    try {
      var v = localStorage.getItem(THEME_KEY);
      if (v === 'light' || v === 'dark') return v;
    } catch (e) {}
    return 'system';
  }
  function effectiveTheme() {
    if (themePref === 'light' || themePref === 'dark') return themePref;
    if (!window.matchMedia) return 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme() {
    var t = effectiveTheme();
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
    var meta = document.getElementById('metaTheme');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#070b10' : '#eef2f6');
    if (el.theme) {
      el.theme.textContent = themePref === 'system' ? 'AUTO' : themePref.toUpperCase();
      el.theme.setAttribute('aria-label', 'Theme: ' + (themePref === 'system' ? 'follow device' : themePref) + '. Tap to change.');
    }
  }
  function cycleTheme() {
    themePref = themePref === 'system' ? 'light' : themePref === 'light' ? 'dark' : 'system';
    try { localStorage.setItem(THEME_KEY, themePref); } catch (e) {}
    applyTheme();
  }
  function parseDur(str) {
    var t = String(str).trim();
    if (!t) return null;
    var total;
    if (t.indexOf(':') > -1) {
      var parts = t.split(':');
      if (parts.length > 2) return null;
      var m = parseInt(parts[0], 10);
      var s = parseInt(parts[1], 10);
      if (!isFinite(m) || !isFinite(s) || m < 0 || s < 0 || s > 59) return null;
      total = m * 60 + s;
    } else {
      var n = parseInt(t, 10);
      if (!isFinite(n) || n < 0) return null;
      total = n;
    }
    return (total >= 1 && total <= 3600) ? total : null;
  }
  function activeKind() {
    if (phase === 'jam' || phase === 'ready') return 'jam';
    if (phase === 'lineup') return 'lineup';
    if (phase === 'timeout') return 'timeout';
    return null;
  }
  function setLength(kind, sec) {
    var old = settings[kind];
    if (sec === old) return;
    settings[kind] = sec;
    saveTimes();
    var delta = (sec - old) * 1000;
    var lim = sec * 1000;
    if (kind === 'period') {
      if (period.running) {
        period.value = Math.max(0, Math.min(lim, read(period) + delta));
        period.anchor = now();
      } else if (phase === 'ready') {
        period.value = lim;
      } else if (phase === 'lineup' || phase === 'timeout') {
        period.value = Math.max(0, Math.min(lim, period.value + delta));
      }
    } else if (kind === 'jam') {
      if (phase === 'jam') {
        main.value = Math.max(0, Math.min(lim, read(main) + delta));
        main.anchor = now();
      } else if (phase === 'ready') {
        main.value = lim;
      }
    } else if (kind === 'lineup') {
      if (phase === 'lineup') {
        main.value = Math.max(0, Math.min(lim, read(main) + delta));
        main.anchor = now();
      }
    } else if (kind === 'timeout') {
      if (phase === 'timeout') {
        main.value = Math.max(0, Math.min(lim, read(main) + delta));
        main.anchor = now();
      }
    }
    render();
  }
  function startEdit(kind) {
    editing = kind;
    el.editorLabel.textContent = KIND_LABELS[kind];
    el.editorInput.value = fmt(settings[kind] * 1000);
    el.editor.hidden = false;
    el.configLine.hidden = true;
    setTimeout(function () {
      try { el.editorInput.focus(); el.editorInput.select(); } catch (e) {}
    }, 10);
  }
  function stopEdit() {
    editing = null;
    el.editor.hidden = true;
    el.configLine.hidden = false;
  }
  function commitEdit() {
    if (!editing) return;
    var kind = editing;
    var sec = parseDur(el.editorInput.value);
    stopEdit();
    if (sec != null) setLength(kind, sec);
    else render();
  }
  function cancelEdit() {
    if (!editing) return;
    stopEdit();
    render();
  }

  function startJam() {
    stopEdit();
    if (phase === 'done') {
      if (periodNo < PERIODS) startNextPeriod();
      return;
    }
    if (phase !== 'ready' && phase !== 'lineup') return;
    if (phase === 'ready') {
      periodNo = 1;
      jamNo = 0;
      period = { value: settings.period * 1000, running: false, anchor: 0 };
    }
    jamNo += 1;
    phase = 'jam';
    setMain('jam', settings.jam * 1000, true);
    if (period.value > 0) start(period);
    render();
  }

  function endJam(auto) {
    if (phase !== 'jam') return;
    stopEdit();
    stop(main);
    if (auto) alertEnd();
    if (read(period) <= 0) { periodOver(); return; }
    phase = 'lineup';
    setMain('lineup', settings.lineup * 1000, true);
    render();
  }

  function periodOver() {
    main.value = 0;
    main.running = false;
    stop(period);
    phase = 'done';
    render();
  }

  function startNextPeriod() {
    stopEdit();
    periodNo += 1;
    period = { value: settings.period * 1000, running: false, anchor: 0 };
    phase = 'lineup';
    setMain('lineup', settings.lineup * 1000, true);
    render();
  }

  function toggleTimeout() {
    if (phase === 'timeout') { endTimeout(); return; }
    if (phase !== 'jam' && phase !== 'lineup') return;
    stopEdit();
    stop(main);
    stop(period);
    phase = 'timeout';
    setMain('timeout', settings.timeout * 1000, true);
    render();
  }

  function endTimeout() {
    if (phase !== 'timeout') return;
    stopEdit();
    stop(main);
    if (read(period) <= 0) { periodOver(); return; }
    phase = 'lineup';
    setMain('lineup', settings.lineup * 1000, true);
    render();
  }

  function resetAll() {
    stopEdit();
    phase = 'ready';
    periodNo = 1;
    jamNo = 0;
    period = { value: settings.period * 1000, running: false, anchor: 0 };
    setMain('jam', settings.jam * 1000, false);
    render();
  }

  function handleReset() {
    if (!resetArmed) { armReset(); return; }
    disarmReset();
    resetAll();
  }
  function armReset() {
    resetArmed = true;
    el.reset.textContent = 'SURE?';
    el.reset.classList.add('armed');
    clearTimeout(resetTimer);
    resetTimer = setTimeout(disarmReset, 2500);
  }
  function disarmReset() {
    resetArmed = false;
    el.reset.textContent = 'RESET';
    el.reset.classList.remove('armed');
    clearTimeout(resetTimer);
  }

  function render() {
    document.body.dataset.phase = phase;

    var p = read(period);
    var m = read(main);

    set(el.periodTime, fmt(p));
    el.periodTime.classList.toggle('over', p <= 0);
    set(el.periodMeta, 'PERIOD ' + periodNo + '/' + PERIODS);
    set(el.jamMeta, 'JAM ' + jamNo);

    var badge = phase === 'ready' ? 'READY'
      : phase === 'jam' ? 'JAM'
      : phase === 'lineup' ? 'LINEUP'
      : phase === 'timeout' ? 'TIMEOUT'
      : periodNo < PERIODS ? 'PERIOD OVER' : 'FINAL';
    set(el.badge, badge);

    var label, sub, plabel, pclass = 'go', tdis = false;

    if (phase === 'jam') {
      label = 'JAM CLOCK';
      sub = 'Jam ' + jamNo + (p <= 0 ? ' · period time expired' : '');
      plabel = 'END JAM';
      pclass = 'stop';
    } else if (phase === 'lineup') {
      label = 'LINEUP';
      sub = m <= 0 ? 'Tap start for the next jam' : 'Next jam';
      plabel = 'START JAM';
    } else if (phase === 'timeout') {
      label = 'TIMEOUT';
      sub = 'Period clock stopped';
      plabel = 'END TIMEOUT';
      tdis = true;
    } else if (phase === 'done') {
      label = periodNo < PERIODS ? 'PERIOD ' + periodNo + ' OVER' : 'FINAL';
      sub = periodNo < PERIODS ? 'Tap to start period ' + (periodNo + 1) : 'Bout complete';
      plabel = periodNo < PERIODS ? 'START PERIOD ' + (periodNo + 1) : 'NEW BOUT';
      pclass = periodNo < PERIODS ? 'go' : 'neutral';
      tdis = true;
    } else {
      label = 'JAM CLOCK';
      sub = 'Tap start';
      plabel = 'START JAM';
      tdis = true;
    }

    set(el.clockLabel, label);
    if (flashMsg) sub = flashMsg;
    set(el.clockSub, sub);
    set(el.clockTime, fmt(m));

    set(el.cfgJam, fmt(settings.jam * 1000));
    set(el.cfgLineup, fmt(settings.lineup * 1000));
    set(el.cfgTimeout, fmt(settings.timeout * 1000));
    var active = activeKind();
    el.cfgJam.parentElement.classList.toggle('active', active === 'jam');
    el.cfgLineup.parentElement.classList.toggle('active', active === 'lineup');
    el.cfgTimeout.parentElement.classList.toggle('active', active === 'timeout');

    if (el.primary.textContent !== plabel) el.primary.textContent = plabel;
    el.primary.className = 'primary ' + pclass;
    el.timeout.disabled = tdis;
  }

  function tick() {
    requestAnimationFrame(tick);
    var t = now();
    if (t - lastFrame < 50) return;
    lastFrame = t;

    var m = read(main);
    var p = read(period);

    if (phase === 'jam' && m <= 0) {
      endJam(true);
    } else if (phase === 'lineup' && m <= 0) {
      stop(main);
    } else if (phase === 'timeout' && m <= 0) {
      stop(main);
    }

    if (phase === 'lineup' && read(period) <= 0) periodOver();

    render();
  }

  el.primary.addEventListener('click', function () {
    if (phase === 'jam') endJam(false);
    else if (phase === 'timeout') endTimeout();
    else if (phase === 'done') {
      if (periodNo < PERIODS) startNextPeriod();
      else resetAll();
    } else {
      startJam();
    }
  });
  el.timeout.addEventListener('click', toggleTimeout);
  el.test.addEventListener('click', function () {
    audio();
    chime();
    if (!navigator.vibrate) flash('No vibration API on this browser');
    else if (!buzz()) flash('Vibration blocked by the browser');
    else flash('Vibration sent');
  });
  el.reset.addEventListener('click', handleReset);
  el.theme.addEventListener('click', cycleTheme);
  el.periodTime.addEventListener('click', function () { startEdit('period'); });
  el.clockTime.addEventListener('click', function () {
    var k = activeKind();
    if (k) startEdit(k);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.cfg'), function (btn) {
    btn.addEventListener('click', function () { startEdit(btn.dataset.kind); });
  });
  el.editorSet.addEventListener('click', commitEdit);
  el.editorCancel.addEventListener('click', cancelEdit);
  el.editorInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitEdit(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
  });
  document.addEventListener('pointerdown', function () { audio(); });

  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () { if (themePref === 'system') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }

  window.__jt = {
    get phase() { return phase; },
    get jam() { return jamNo; },
    get periodNo() { return periodNo; },
    get times() { return settings; },
    get theme() { return themePref; },
    get effectiveTheme() { return effectiveTheme(); },
    read: function () { return { period: read(period), main: read(main) }; },
    setMain: function (ms) { main.value = Math.max(0, ms); main.anchor = now(); },
    setPeriod: function (ms) { period.value = Math.max(0, ms); period.anchor = now(); },
    setLength: setLength,
    alert: alertEnd
  };

  applyTheme();
  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
